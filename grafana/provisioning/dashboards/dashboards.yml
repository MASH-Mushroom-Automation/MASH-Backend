# Grafana Dashboards - Auto-provisioned on startup
# This file automatically loads dashboard JSON files

apiVersion: 1

providers:
  # Default dashboard provider
  - name: 'MASH Backend Dashboards'
    orgId: 1
    folder: 'MASH Performance'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
