version: '3.8'

services:
  api:
    container_name: mash-backend-test
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Core configuration
      - NODE_ENV=development
      - PORT=3000
      
      # Database - from .env, quoted values handled properly by Docker Compose
      - DATABASE_URL=${DATABASE_URL}
      
      # Redis - Optional, gracefully degrades
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      
      # Firebase - Make optional for testing
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL:-}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY:-}
      - FIREBASE_API_KEY=${FIREBASE_API_KEY:-}
      - FIREBASE_DATABASE_URL=${FIREBASE_DATABASE_URL:-}
      
      # Other services
      - MQTT_URL=${MQTT_URL:-mqtt://mqtt:1883}
    networks:
      - mash-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

networks:
  mash-network:
    external: true
    name: mash-backend_mash-network
