# fly.toml - Fly.io configuration for MASH Backend
# Using external Neon PostgreSQL database

app = "mash-backend-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[[services]]
  internal_port = 3000
  protocol = "tcp"
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "get"
    path = "/api/v1/health"
    protocol = "http"

[mounts]
  source = "mash_uploads"
  destination = "/app/uploads"
  initial_size = "3gb"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
