sonar.projectKey=MASH-Mushroom-Automation_MASH-Backend
sonar.organization=mash-mushroom-automation

# Project information
sonar.projectName=MASH Backend API
sonar.projectVersion=1.0.0

# Source code
sonar.sources=src
sonar.tests=test
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.spec.ts,**/*.e2e-spec.ts,**/test/**,**/prisma/**,**/postman/**,**/*.json,**/*.md

# Test exclusions
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts

# Coverage
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Quality gate
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Language-specific settings
sonar.language=ts
sonar.typescript.tsconfigPath=tsconfig.json

# Duplication settings
sonar.cpd.exclusions=**/*.spec.ts,**/*.e2e-spec.ts

# Additional analysis parameters
sonar.links.homepage=https://github.com/MASH-Mushroom-Automation/MASH-Backend
sonar.links.ci=https://github.com/MASH-Mushroom-Automation/MASH-Backend/actions
sonar.links.scm=https://github.com/MASH-Mushroom-Automation/MASH-Backend
sonar.links.issue=https://github.com/MASH-Mushroom-Automation/MASH-Backend/issues
