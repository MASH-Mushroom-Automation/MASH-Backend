<svg width="600" height="200" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#66BB6A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#81C784;stop-opacity:1" />
    </linearGradient>
    
    <!-- Pattern overlay for texture -->
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255,255,255,0.1)"/>
    </pattern>
  </defs>
  
  <!-- Base gradient -->
  <rect width="600" height="200" fill="url(#grad1)"/>
  
  <!-- Pattern overlay -->
  <rect width="600" height="200" fill="url(#dots)"/>
  
  <!-- Decorative mushroom icons (subtle) -->
  <g opacity="0.15" fill="white">
    <!-- Left mushroom -->
    <g transform="translate(80, 100)">
      <ellipse cx="0" cy="-10" rx="25" ry="15"/>
      <rect x="-8" y="-10" width="16" height="30" rx="4"/>
    </g>
    
    <!-- Right mushroom -->
    <g transform="translate(520, 80)">
      <ellipse cx="0" cy="-8" rx="20" ry="12"/>
      <rect x="-6" y="-8" width="12" height="24" rx="3"/>
    </g>
    
    <!-- Center small mushroom -->
    <g transform="translate(300, 50)">
      <ellipse cx="0" cy="-5" rx="15" ry="9"/>
      <rect x="-4" y="-5" width="8" height="18" rx="2"/>
    </g>
  </g>
  
  <!-- Company name (subtle) -->
  <text x="300" y="170" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="rgba(255,255,255,0.3)" text-anchor="middle">MASH</text>
  <text x="300" y="190" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.4)" text-anchor="middle">Mushroom Automation System Hub</text>
</svg>
