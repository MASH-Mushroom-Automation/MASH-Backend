# Docker Compose for OpenTelemetry Tracing Infrastructure
# 
# This file sets up Jaeger for distributed tracing.
# Jaeger is an open-source, end-to-end distributed tracing tool.
#
# Usage:
#   docker-compose -f docker-compose.tracing.yml up -d
#
# Access Jaeger UI: http://localhost:16686

version: '3.8'

services:
  # Jaeger All-in-One (includes collector, query, UI)
  jaeger:
    image: jaegertracing/all-in-one:1.52
    container_name: mash-jaeger
    restart: unless-stopped
    ports:
      # Jaeger UI
      - "16686:16686"
      # OTLP HTTP receiver (for OpenTelemetry)
      - "4318:4318"
      # OTLP gRPC receiver (alternative)
      - "4317:4317"
      # Zipkin HTTP receiver (legacy)
      - "9411:9411"
      # Jaeger Thrift HTTP
      - "14268:14268"
      # Jaeger gRPC
      - "14250:14250"
    environment:
      # Collector configuration
      - COLLECTOR_OTLP_ENABLED=true
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
      
      # Storage backend (memory for development)
      # For production, use Cassandra, Elasticsearch, or BadgerDB
      - SPAN_STORAGE_TYPE=memory
      
      # Query service configuration
      - QUERY_BASE_PATH=/
      
      # Log level
      - LOG_LEVEL=info
    networks:
      - tracing-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:16686"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Zipkin (alternative UI)
  # zipkin:
  #   image: openzipkin/zipkin:2.24
  #   container_name: mash-zipkin
  #   restart: unless-stopped
  #   ports:
  #     - "9411:9411"
  #   environment:
  #     - STORAGE_TYPE=mem
  #   networks:
  #     - tracing-network

networks:
  tracing-network:
    driver: bridge
    name: mash-tracing-network

