version: '3.8'

services:
  # Prometheus - Metrics Collection and Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: mash-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - monitoring-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Grafana - Visualization and Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: mash-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"  # Use 3001 to avoid conflict with API on 3000
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: false
      GF_INSTALL_PLUGINS: grafana-piechart-panel,grafana-worldmap-panel
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - jaeger
    networks:
      - monitoring-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Jaeger - Distributed Tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: mash-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # Accept jaeger.thrift over HTTP
      - "14250:14250"  # Accept jaeger.thrift over gRPC
    environment:
      COLLECTOR_OTLP_ENABLED: true
      COLLECTOR_ZIPKIN_HOST_PORT: :9411
    volumes:
      - jaeger_data:/tmp
    networks:
      - monitoring-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:16686/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Alertmanager - Alert Management and Notifications
  alertmanager:
    image: prom/alertmanager:latest
    container_name: mash-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager/templates:/etc/alertmanager/templates:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - monitoring-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Node Exporter for system metrics
  # Uncomment to enable system-level monitoring
  # node-exporter:
  #   image: prom/node-exporter:latest
  #   container_name: mash-node-exporter
  #   restart: unless-stopped
  #   ports:
  #     - "9100:9100"
  #   volumes:
  #     - /proc:/host/proc:ro
  #     - /sys:/host/sys:ro
  #     - /:/rootfs:ro
  #   command:
  #     - '--path.procfs=/host/proc'
  #     - '--path.rootfs=/rootfs'
  #     - '--path.sysfs=/host/sys'
  #     - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
  #   networks:
  #     - monitoring-network

  # Optional: Redis Exporter for Redis metrics
  # Uncomment to enable detailed Redis monitoring
  # redis-exporter:
  #   image: oliver006/redis_exporter:latest
  #   container_name: mash-redis-exporter
  #   restart: unless-stopped
  #   ports:
  #     - "9121:9121"
  #   environment:
  #     REDIS_ADDR: redis:6379
  #     REDIS_PASSWORD: ""
  #   depends_on:
  #     - redis
  #   networks:
  #     - monitoring-network

  # Optional: PostgreSQL Exporter for database metrics
  # Uncomment to enable detailed PostgreSQL monitoring
  # postgres-exporter:
  #   image: prometheuscommunity/postgres-exporter:latest
  #   container_name: mash-postgres-exporter
  #   restart: unless-stopped
  #   ports:
  #     - "9187:9187"
  #   environment:
  #     DATA_SOURCE_NAME: postgresql://postgres:postgres@postgres:5432/mash_backend_dev?sslmode=disable
  #   depends_on:
  #     - postgres
  #   networks:
  #     - monitoring-network

volumes:
  prometheus_data:
  grafana_data:
  jaeger_data:
  alertmanager_data:

networks:
  monitoring-network:
    driver: bridge