name: GitHub Copilot Auto-Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main, develop ]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  copilot-review:
    name: Copilot Code Review
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Get PR diff
        id: pr-diff
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          git diff origin/${{ github.event.pull_request.base.ref }}...HEAD > pr-diff.txt
          
          # Truncate if too large (max 10000 lines for API)
          if [ $(wc -l < pr-diff.txt) -gt 10000 ]; then
            head -n 10000 pr-diff.txt > pr-diff-truncated.txt
            mv pr-diff-truncated.txt pr-diff.txt
            echo "truncated=true" >> $GITHUB_OUTPUT
          else
            echo "truncated=false" >> $GITHUB_OUTPUT
          fi

      - name: Get changed files
        id: changed-files
        run: |
          git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD > changed-files.txt
          FILES=$(cat changed-files.txt | tr '\n' ',' | sed 's/,$//')
          echo "files=$FILES" >> $GITHUB_OUTPUT
          
          # Count files by type
          TS_COUNT=$(grep -c '\.ts$' changed-files.txt || echo 0)
          TEST_COUNT=$(grep -c '\.spec\.ts$\|\.test\.ts$' changed-files.txt || echo 0)
          TOTAL_COUNT=$(wc -l < changed-files.txt)
          
          echo "ts_count=$TS_COUNT" >> $GITHUB_OUTPUT
          echo "test_count=$TEST_COUNT" >> $GITHUB_OUTPUT
          echo "total_count=$TOTAL_COUNT" >> $GITHUB_OUTPUT

      - name: Copilot Code Review
        id: copilot-review
        uses: actions/github-script@v8
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const fs = require('fs');
            
            // Read PR diff
            const diff = fs.readFileSync('pr-diff.txt', 'utf8');
            const changedFiles = fs.readFileSync('changed-files.txt', 'utf8').trim().split('\n');
            const truncated = '${{ steps.pr-diff.outputs.truncated }}' === 'true';
            
            // Prepare review context
            const reviewPrompt = `
            You are an expert code reviewer for a NestJS/TypeScript backend project (MASH Backend - Mushroom Automation).
            
            **PR Context:**
            - Title: ${process.env.PR_TITLE}
            - Description: ${process.env.PR_BODY || 'No description provided'}
            - Changed Files (${changedFiles.length}): ${changedFiles.join(', ')}
            ${truncated ? '⚠️ Note: Diff was truncated due to size' : ''}
            
            **Review Focus Areas:**
            1. **Code Quality**: Check for code smells, anti-patterns, and best practices
            2. **Security**: Look for vulnerabilities, exposed secrets, SQL injection risks
            3. **Performance**: Identify N+1 queries, inefficient algorithms, missing indexes
            4. **Testing**: Verify test coverage for new code
            5. **TypeScript**: Check type safety, avoid 'any', proper interfaces
            6. **NestJS Best Practices**: Proper use of decorators, DI, modules
            7. **Database**: Prisma query optimization, transaction handling
            8. **Error Handling**: Proper exception handling and logging
            9. **Documentation**: Check if complex logic is documented
            10. **Breaking Changes**: Identify any breaking API changes
            
            **Code Diff:**
            \`\`\`diff
            ${diff.substring(0, 8000)} ${diff.length > 8000 ? '... (truncated)' : ''}
            \`\`\`
            
            Please provide:
            1. **Summary**: Brief overview of changes
            2. **Security Issues**: 🔴 Critical security concerns (if any)
            3. **Performance Issues**: ⚠️ Performance concerns (if any)
            4. **Code Quality**: 💡 Suggestions for improvement
            5. **Best Practices**: ✨ Recommendations
            6. **Testing**: ✅ Test coverage feedback
            7. **Overall Assessment**: APPROVE, REQUEST_CHANGES, or COMMENT
            
            Format as markdown with clear sections and emojis.
            `;
            
            // Note: GitHub Copilot API doesn't have a direct public API for code reviews
            // This is a placeholder for when the API becomes available
            // For now, we'll create a comprehensive automated review based on patterns
            
            // Analyze the diff programmatically
            const issues = [];
            const suggestions = [];
            const security = [];
            const performance = [];
            
            // Security checks
            if (diff.includes('password') && !diff.includes('hash')) {
              security.push('⚠️ Potential security issue: Password handling detected without hashing');
            }
            if (diff.match(/API_KEY|SECRET|TOKEN/i) && !diff.includes('.env')) {
              security.push('🔴 CRITICAL: Hardcoded credentials detected! Move to .env file');
            }
            if (diff.includes('eval(') || diff.includes('exec(')) {
              security.push('🔴 CRITICAL: Dangerous function detected (eval/exec)');
            }
            if (diff.includes('SELECT * FROM') || diff.includes('findMany()')) {
              performance.push('⚠️ Performance: Consider selecting specific fields instead of *');
            }
            
            // Performance checks
            if (diff.match(/for\s*\(/g)?.length > 3) {
              performance.push('⚠️ Multiple loops detected - consider optimization');
            }
            if (diff.includes('.map(') && diff.includes('await')) {
              performance.push('⚠️ Async operations in map - consider Promise.all()');
            }
            if (diff.includes('findMany') && !diff.includes('take:')) {
              performance.push('💡 Consider adding pagination (take/skip) to findMany queries');
            }
            
            // Code quality checks
            if (diff.includes('any') && !diff.includes('// @ts-ignore')) {
              suggestions.push('💡 Avoid using `any` type - use proper TypeScript types');
            }
            if (diff.includes('console.log') && !diff.includes('logger')) {
              suggestions.push('💡 Replace console.log with proper logger (winston)');
            }
            if (diff.match(/try\s*{[\s\S]*?}\s*catch/g) && !diff.includes('this.logger')) {
              suggestions.push('💡 Add logging in catch blocks for better debugging');
            }
            
            // Testing checks
            const hasTests = changedFiles.some(f => f.includes('.spec.ts') || f.includes('.test.ts'));
            const hasSourceChanges = changedFiles.some(f => 
              f.endsWith('.ts') && 
              !f.includes('.spec.ts') && 
              !f.includes('.test.ts') &&
              f.includes('src/')
            );
            
            let testFeedback = '';
            if (hasSourceChanges && !hasTests) {
              testFeedback = '⚠️ **Missing Tests**: Source code changes detected but no test files updated';
            } else if (hasTests) {
              testFeedback = '✅ **Tests Included**: Great job including tests!';
            }
            
            // Generate review comment
            let reviewBody = `## 🤖 GitHub Copilot Auto-Review\n\n`;
            
            reviewBody += `### 📊 Summary\n`;
            reviewBody += `- **Files Changed**: ${changedFiles.length}\n`;
            reviewBody += `- **TypeScript Files**: ${{ steps.changed-files.outputs.ts_count }}\n`;
            reviewBody += `- **Test Files**: ${{ steps.changed-files.outputs.test_count }}\n`;
            reviewBody += `- **Diff Size**: ${diff.split('\n').length} lines\n\n`;
            
            if (security.length > 0) {
              reviewBody += `### 🔒 Security Issues\n`;
              security.forEach(issue => reviewBody += `${issue}\n`);
              reviewBody += `\n`;
            }
            
            if (performance.length > 0) {
              reviewBody += `### ⚡ Performance Concerns\n`;
              performance.forEach(issue => reviewBody += `${issue}\n`);
              reviewBody += `\n`;
            }
            
            if (suggestions.length > 0) {
              reviewBody += `### 💡 Code Quality Suggestions\n`;
              suggestions.forEach(suggestion => reviewBody += `${suggestion}\n`);
              reviewBody += `\n`;
            }
            
            if (testFeedback) {
              reviewBody += `### ✅ Testing\n${testFeedback}\n\n`;
            }
            
            // Best practices check
            reviewBody += `### ✨ Best Practices Checklist\n`;
            reviewBody += `- ${diff.includes('class-validator') || diff.includes('@Is') ? '✅' : '⚠️'} Input validation with class-validator\n`;
            reviewBody += `- ${diff.includes('@ApiProperty') || diff.includes('swagger') ? '✅' : '⚠️'} Swagger documentation\n`;
            reviewBody += `- ${diff.includes('try') && diff.includes('catch') ? '✅' : '⚠️'} Error handling\n`;
            reviewBody += `- ${diff.includes('logger') || diff.includes('winston') ? '✅' : '⚠️'} Proper logging\n`;
            reviewBody += `- ${!diff.includes('any') || diff.includes('// eslint-disable') ? '✅' : '⚠️'} Type safety\n\n`;
            
            // Overall assessment
            const hasCritical = security.some(s => s.includes('CRITICAL'));
            const hasWarnings = security.length > 0 || performance.length > 0 || (hasSourceChanges && !hasTests);
            
            reviewBody += `### 🎯 Overall Assessment\n`;
            if (hasCritical) {
              reviewBody += `**Status**: 🔴 REQUEST CHANGES\n\n`;
              reviewBody += `Critical security issues must be addressed before merging.\n`;
            } else if (hasWarnings) {
              reviewBody += `**Status**: ⚠️ COMMENT\n\n`;
              reviewBody += `Changes look good but there are some suggestions for improvement.\n`;
            } else {
              reviewBody += `**Status**: ✅ APPROVE\n\n`;
              reviewBody += `Code looks good! No major issues detected.\n`;
            }
            
            reviewBody += `\n---\n`;
            reviewBody += `*This is an automated review by GitHub Copilot. Human review is still recommended for complex changes.*\n`;
            reviewBody += `*Review focuses on: Security, Performance, Code Quality, Testing, and NestJS Best Practices*\n`;
            
            // Post the review
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: process.env.PR_NUMBER,
              body: reviewBody
            });
            
            // Set output for next steps
            core.setOutput('has_critical', hasCritical);
            core.setOutput('has_warnings', hasWarnings);

      - name: Request changes if critical issues found
        if: steps.copilot-review.outputs.has_critical == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              event: 'REQUEST_CHANGES',
              body: '🔴 Critical security issues detected by automated review. Please address them before merging.'
            });

      - name: Add labels based on review
        uses: actions/github-script@v8
        with:
          script: |
            const labels = [];
            const hasCritical = '${{ steps.copilot-review.outputs.has_critical }}' === 'true';
            const hasWarnings = '${{ steps.copilot-review.outputs.has_warnings }}' === 'true';
            
            if (hasCritical) {
              labels.push('security', 'needs-changes');
            } else if (hasWarnings) {
              labels.push('needs-review');
            } else {
              labels.push('ready-to-merge');
            }
            
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: labels
              });
            }
