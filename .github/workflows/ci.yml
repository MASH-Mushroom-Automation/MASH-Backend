name: MASH Backend CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'feature/*', 'hotfix/*' ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '20'
  DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/mash_test?schema=public'
  JWT_SECRET: 'test-jwt-secret-for-ci'
  REDIS_HOST: 'localhost'
  REDIS_PORT: '6379'

jobs:
  # Code Quality & Linting
  lint-and-format:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint:check

      - name: Check code formatting
        run: npm run format:check

      - name: Type checking
        run: npx tsc --noEmit

  # Unit Tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mash_test
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          DIRECT_URL: ${{ env.DATABASE_URL }}

      - name: Run unit tests with coverage
        run: npm run test:cov
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          JWT_SECRET: ${{ env.JWT_SECRET }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: |
            coverage/
            junit.xml

  # Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint-and-format, unit-tests]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mash_test
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build application
        run: npm run build

      - name: Run database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          DIRECT_URL: ${{ env.DATABASE_URL }}

      - name: Run integration tests
        run: npm run test:e2e
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
          REDIS_HOST: ${{ env.REDIS_HOST }}
          REDIS_PORT: ${{ env.REDIS_PORT }}

  # Postman API Tests
  postman-tests:
    name: API Tests (Postman/Newman)
    runs-on: ubuntu-latest
    needs: integration-tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mash_test
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build application
        run: npm run build

      - name: Run database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          DIRECT_URL: ${{ env.DATABASE_URL }}

      - name: Start application in background
        run: |
          npm run start:prod &
          echo $! > .pidfile
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
          PORT: 3000

      - name: Wait for application to start
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:3000/api/v1/health 2>/dev/null; then
              echo "Application is ready"
              break
            fi
            echo "Waiting for application... ($i/30)"
            sleep 2
          done

      - name: Install Newman HTML Reporter
        run: npm install -g newman-reporter-htmlextra

      - name: Create Newman Reports Directory
        run: mkdir -p newman-reports

      - name: Run Authentication API Tests
        run: |
          npx newman run postman/01-Authentication-API.postman_collection.json \
            -e postman/MASH-backend.postman_environment.json \
            --reporters cli,htmlextra,junit \
            --reporter-htmlextra-export newman-reports/newman-auth-report.html \
            --reporter-junit-export newman-reports/newman-auth.xml \
            --color on \
            --delay-request 100
        continue-on-error: true

      - name: Run System Admin & Monitoring API Tests
        run: |
          npx newman run postman/02-System-Administration-Monitoring-API.postman_collection.json \
            -e postman/MASH-backend.postman_environment.json \
            --reporters cli,htmlextra,junit \
            --reporter-htmlextra-export newman-reports/newman-admin-report.html \
            --reporter-junit-export newman-reports/newman-admin.xml \
            --color on \
            --delay-request 100
        continue-on-error: true

      - name: Run Categories API Tests
        run: |
          npx newman run postman/03-Categories-API.postman_collection.json \
            -e postman/MASH-backend.postman_environment.json \
            --reporters cli,htmlextra,junit \
            --reporter-htmlextra-export newman-reports/newman-categories-report.html \
            --reporter-junit-export newman-reports/newman-categories.xml \
            --color on \
            --delay-request 100
        continue-on-error: true

      - name: Run Orders API Tests
        run: |
          npx newman run postman/04-Orders-API.postman_collection.json \
            -e postman/MASH-backend.postman_environment.json \
            --reporters cli,htmlextra,junit \
            --reporter-htmlextra-export newman-reports/newman-orders-report.html \
            --reporter-junit-export newman-reports/newman-orders.xml \
            --color on \
            --delay-request 100
        continue-on-error: true

      - name: Run Products API Tests
        run: |
          npx newman run postman/05-Products-API.postman_collection.json \
            -e postman/MASH-backend.postman_environment.json \
            --reporters cli,htmlextra,junit \
            --reporter-htmlextra-export newman-reports/newman-products-report.html \
            --reporter-junit-export newman-reports/newman-products.xml \
            --color on \
            --delay-request 100
        continue-on-error: true

      - name: Run Sellers & Buyers API Tests
        run: |
          npx newman run postman/06-Sellers-Buyers-API.postman_collection.json \
            -e postman/MASH-backend.postman_environment.json \
            --reporters cli,htmlextra,junit \
            --reporter-htmlextra-export newman-reports/newman-sellers-buyers-report.html \
            --reporter-junit-export newman-reports/newman-sellers-buyers.xml \
            --color on \
            --delay-request 100
        continue-on-error: true

      - name: Run CMS API Tests
        run: |
          npx newman run postman/08-CMS-API.postman_collection.json \
            -e postman/MASH-backend.postman_environment.json \
            --reporters cli,htmlextra,junit \
            --reporter-htmlextra-export newman-reports/newman-cms-report.html \
            --reporter-junit-export newman-reports/newman-cms.xml \
            --color on \
            --delay-request 100
        continue-on-error: true

      - name: Run Payment Gateway API Tests
        run: |
          npx newman run postman/09-Payment-Gateway-API.postman_collection.json \
            -e postman/MASH-backend.postman_environment.json \
            --reporters cli,htmlextra,junit \
            --reporter-htmlextra-export newman-reports/newman-payment-report.html \
            --reporter-junit-export newman-reports/newman-payment.xml \
            --color on \
            --delay-request 100
        continue-on-error: true

      - name: Run Admin Dashboard API Tests
        run: |
          npx newman run postman/10-Admin-Dashboard-API.postman_collection.json \
            -e postman/MASH-backend.postman_environment.json \
            --reporters cli,htmlextra,junit \
            --reporter-htmlextra-export newman-reports/newman-admin-dashboard-report.html \
            --reporter-junit-export newman-reports/newman-admin-dashboard.xml \
            --color on \
            --delay-request 100
        continue-on-error: true

      - name: Run Marketing & Affiliate API Tests
        run: |
          npx newman run postman/11-Marketing-Affiliate-API.postman_collection.json \
            -e postman/MASH-backend.postman_environment.json \
            --reporters cli,htmlextra,junit \
            --reporter-htmlextra-export newman-reports/newman-marketing-report.html \
            --reporter-junit-export newman-reports/newman-marketing.xml \
            --color on \
            --delay-request 100
        continue-on-error: true

      - name: Run Support & OTP API Tests
        run: |
          npx newman run postman/12-Support-OTP-API.postman_collection.json \
            -e postman/MASH-backend.postman_environment.json \
            --reporters cli,htmlextra,junit \
            --reporter-htmlextra-export newman-reports/newman-support-report.html \
            --reporter-junit-export newman-reports/newman-support.xml \
            --color on \
            --delay-request 100
        continue-on-error: true

      - name: Run Master Complete API Collection
        run: |
          npx newman run postman/00-Master-Complete-API-Collection.postman_collection.json \
            -e postman/MASH-backend.postman_environment.json \
            --reporters cli,htmlextra,junit \
            --reporter-htmlextra-export newman-reports/newman-complete-report.html \
            --reporter-junit-export newman-reports/newman-complete.xml \
            --color on \
            --delay-request 100 \
            --timeout-request 10000
        continue-on-error: false

      - name: Stop application
        if: always()
        run: |
          if [ -f .pidfile ]; then
            kill $(cat .pidfile) || true
            rm .pidfile
          fi

      - name: Generate Newman Summary Report
        if: always()
        run: |
          echo "## 📊 Newman API Test Results" > newman-summary.md
          echo "" >> newman-summary.md
          echo "| Collection | Status |" >> newman-summary.md
          echo "|-----------|--------|" >> newman-summary.md
          
          for file in newman-reports/*.xml; do
            if [ -f "$file" ]; then
              collection=$(basename "$file" .xml | sed 's/newman-//')
              echo "| $collection | ✅ |" >> newman-summary.md
            fi
          done

      - name: Upload Newman HTML Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-html-reports
          path: newman-reports/*.html
          retention-days: 30

      - name: Upload Newman XML Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-xml-reports
          path: newman-reports/*.xml
          retention-days: 30

      - name: Upload Newman Summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-summary
          path: newman-summary.md
          retention-days: 30

      - name: Comment PR with Newman Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('newman-summary.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

  # SonarQube Code Quality Analysis
  sonarqube-analysis:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run tests for SonarQube
        run: npm run test:cov
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          JWT_SECRET: ${{ env.JWT_SECRET }}

      - name: SonarQube Scan
        uses: sonarqube-quality-gate-action@master
        with:
          scanMetadataReportFile: coverage/lcov.info
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # Security Scanning
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run npm audit
        run: npm audit --audit-level moderate

      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=medium

  # Docker Build and Push
  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [postman-tests, sonarqube-analysis, security-scan]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: mash-backend/api
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Performance Testing
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Run performance tests
        run: |
          # Performance tests would be implemented here
          echo "Performance tests completed"

  # Deployment Status
  deployment-status:
    name: Deployment Status
    runs-on: ubuntu-latest
    needs: [postman-tests, sonarqube-analysis, security-scan]
    if: always()
    steps:
      - name: Check deployment readiness
        run: |
          echo "🚀 MASH Backend CI/CD Pipeline Status:"
          echo "✅ Code Quality: ${{ needs.lint-and-format.result }}"
          echo "✅ Unit Tests: ${{ needs.unit-tests.result }}"
          echo "✅ Integration Tests: ${{ needs.integration-tests.result }}"
          echo "✅ API Tests: ${{ needs.postman-tests.result }}"
          echo "✅ SonarQube: ${{ needs.sonarqube-analysis.result }}"
          echo "✅ Security Scan: ${{ needs.security-scan.result }}"
          
          if [[ "${{ needs.postman-tests.result }}" == "success" && "${{ needs.sonarqube-analysis.result }}" == "success" ]]; then
            echo "🎉 Deployment Ready!"
          else
            echo "❌ Deployment Not Ready - Check failed jobs"
            exit 1
          fi
