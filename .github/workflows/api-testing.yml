name: Automated API Testing

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run tests every day at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  api-tests:
    name: API Automated Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: mash_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v6

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: 🔧 Setup Environment Variables
        run: |
          cat > .env << EOF
          NODE_ENV=test
          PORT=3000
          DATABASE_URL="postgresql://testuser:testpassword@localhost:5432/mash_test?schema=public"
          REDIS_URL="redis://localhost:6379"
          JWT_SECRET="test-jwt-secret-for-automated-testing-min-32-chars"
          JWT_EXPIRES_IN=24h
          JWT_REFRESH_EXPIRES_IN=7d
          FRONTEND_URL=http://localhost:3001
          EOF

      - name: 🗄️ Generate Prisma Client
        run: npx prisma generate

      - name: 🗄️ Run Database Migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/mash_test?schema=public

      - name: 🌱 Seed Test Database
        run: npm run db:seed
        continue-on-error: true
        env:
          DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/mash_test?schema=public

      - name: 🏗️ Build Application
        run: npm run build

      - name: 🧪 Run Unit Tests
        run: npm run test:unit
        continue-on-error: true

      - name: 🚀 Run E2E Tests - Authentication Module
        run: |
          echo "Running automated API tests for Authentication endpoints..."
          npm run test:e2e -- test/e2e/auth --forceExit --detectOpenHandles
        env:
          DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/mash_test?schema=public
          REDIS_URL: redis://localhost:6379

      - name: 📊 Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            test/reports/**/*.html
            test/reports/**/*.json
            coverage/
          retention-days: 30

      - name: 📈 Generate Test Summary
        if: always()
        run: |
          echo "## 🧪 Automated API Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "test/reports/auth-progress.json" ]; then
            echo "### Authentication Module" >> $GITHUB_STEP_SUMMARY
            node -e "
              const fs = require('fs');
              const report = JSON.parse(fs.readFileSync('test/reports/auth-progress.json', 'utf8'));
              console.log('- **Total Endpoints**: ' + report.totalEndpoints);
              console.log('- **Tested**: ' + report.testedEndpoints);
              console.log('- **Passed**: ✅ ' + report.passedEndpoints);
              console.log('- **Failed**: ❌ ' + report.failedEndpoints);
              console.log('- **Coverage**: ' + report.coverage.toFixed(1) + '%');
              console.log('- **Avg Response Time**: ' + report.averageResponseTime.toFixed(0) + 'ms');
            " >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📁 View detailed reports in the artifacts section above." >> $GITHUB_STEP_SUMMARY

      - name: ❌ Fail Workflow if Critical Tests Failed
        if: failure()
        run: |
          echo "❌ Critical API tests failed. Check the test reports for details."
          exit 1

      - name: ✅ Tests Passed
        if: success()
        run: |
          echo "✅ All automated API tests passed successfully!"

  # Notify on Slack/Discord (optional)
  notify:
    name: Notify Test Results
    runs-on: ubuntu-latest
    needs: api-tests
    if: always()
    steps:
      - name: 📢 Send Notification
        run: |
          echo "Test workflow completed with status: ${{ needs.api-tests.result }}"
          # Add Slack/Discord webhook notification here if needed
