name: Performance Tests & Regression Detection

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * 0'  # Weekly on Sunday at 2 AM
  workflow_dispatch:

env:
  K6_VERSION: '0.48.0'
  PERFORMANCE_BASELINE_BRANCH: 'main'
  PERFORMANCE_THRESHOLD_P99: '300'  # 300ms

jobs:
  k6-smoke-test:
    name: K6 Performance Testing
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: mash_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --pull always
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --pull always
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Pre-pull Docker images with retry
        continue-on-error: true
        run: |
          echo "Pre-pulling Docker images to avoid service startup failures..."
          for i in 1 2 3; do
            echo "Attempt $i to pull postgres:15"
            docker pull postgres:15 && break || sleep 10
          done
          for i in 1 2 3; do
            echo "Attempt $i to pull redis:7-alpine"
            docker pull redis:7-alpine && break || sleep 10
          done

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install system dependencies for sharp
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev build-essential python3

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Rebuild sharp for Linux (force reinstall)
        run: |
          npm uninstall sharp --legacy-peer-deps || true
          npm install --include=optional --os=linux --cpu=x64 sharp --legacy-peer-deps
          npm rebuild sharp --force

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Create minimal .env for build
        run: |
          cat > .env << 'EOF'
          # Database - PostgreSQL connection (use 127.0.0.1 to force TCP)
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/mash_test?schema=public&connect_timeout=10
          DIRECT_URL=postgresql://postgres:postgres@127.0.0.1:5432/mash_test?schema=public&connect_timeout=10
          
          # Server Configuration
          NODE_ENV=production
          PORT=3000
          
          # Redis Configuration
          REDIS_URL=redis://127.0.0.1:6379
          REDIS_HOST=127.0.0.1
          REDIS_PORT=6379
          
          # JWT Authentication
          JWT_SECRET=test-jwt-secret-for-performance-tests-min-32-chars-long
          JWT_EXPIRATION=1d
          
          # Clerk Authentication (Placeholders)
          CLERK_SECRET_KEY=sk_test_placeholder
          CLERK_PUBLISHABLE_KEY=pk_test_placeholder
          CLERK_WEBHOOK_SECRET=whsec_placeholder
          
          # Firebase (Empty to disable)
          FIREBASE_PROJECT_ID=
          FIREBASE_CLIENT_EMAIL=
          FIREBASE_PRIVATE_KEY=
          
          # SendGrid (Placeholder)
          SENDGRID_API_KEY=SG.test-key
          
          # Twilio (Placeholders)
          TWILIO_ACCOUNT_SID=ACtest
          TWILIO_AUTH_TOKEN=test-token
          TWILIO_PHONE_NUMBER=+1234567890
          
          # Elasticsearch (Disabled for CI - no Elasticsearch service)
          ELASTICSEARCH_NODE=
          ELASTICSEARCH_USERNAME=
          ELASTICSEARCH_PASSWORD=
          
          # MQTT (Disabled for CI - no MQTT broker)
          MQTT_ENABLED=false
          MQTT_BROKER_URL=
          
          # Rate Limiting
          THROTTLE_TTL=60
          THROTTLE_LIMIT=100
          
          # Logging
          LOG_LEVEL=log
          EOF
          
          echo "=== Created .env file ==="
          echo "Verifying DATABASE_URL in .env:"
          grep DATABASE_URL .env

      - name: Run database migrations
        run: npx prisma migrate deploy
        env:
          # Force TCP by using 127.0.0.1 and export explicit PG envs so clients do not fall back to socket/user
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mash_test?schema=public&connect_timeout=10
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/mash_test?schema=public&connect_timeout=10
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: mash_test
          DB_USER: postgres
          DB_PASSWORD: postgres

      - name: Build application
        run: npm run build
        
      - name: Verify environment configuration
        run: |
          echo "=== Environment Verification ==="
          echo "NODE_ENV: $NODE_ENV"
          echo "DATABASE_URL (masked): postgresql://postgres:****@127.0.0.1:5432/mash_test?schema=public"
          echo "REDIS_URL: $REDIS_URL"
          echo ""
          echo "=== Checking .env file ==="
          if [ -f .env ]; then
            echo "✅ .env file exists"
            echo "DATABASE_URL in .env:"
            grep DATABASE_URL .env | head -1
          else
            echo "❌ .env file not found"
          fi
          echo ""
          echo "=== Checking build output ==="
          if [ -d dist ]; then
            echo "✅ dist directory exists"
            ls -la dist/
          else
            echo "❌ dist directory not found"
          fi
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mash_test?schema=public&connect_timeout=10
          REDIS_URL: redis://127.0.0.1:6379

      - name: Start application in background
        run: |
          # Export all environment variables explicitly before starting
          export NODE_ENV=production
          export PORT=3000
          
          # PostgreSQL connection (force TCP with 127.0.0.1)
          export DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:5432/mash_test?schema=public&connect_timeout=10"
          export DIRECT_URL="postgresql://postgres:postgres@127.0.0.1:5432/mash_test?schema=public&connect_timeout=10"
          
          # Explicit libpq env vars (prevents fallback to OS user)
          export PGHOST=127.0.0.1
          export PGPORT=5432
          export PGUSER=postgres
          export PGPASSWORD=postgres
          export PGDATABASE=mash_test
          # Also export common DB env vars that some libraries/configs may read
          export DB_HOST=127.0.0.1
          export DB_PORT=5432
          export DB_USER=postgres
          export DB_PASSWORD=postgres
          export DB_NAME=mash_test
          
          # Redis
          export REDIS_HOST=127.0.0.1
          export REDIS_PORT=6379
          export REDIS_URL="redis://127.0.0.1:6379"
          
          # Auth
          export JWT_SECRET="test-jwt-secret-for-performance-tests-min-32-chars-long"
          export JWT_EXPIRATION=1d
          export CLERK_SECRET_KEY=sk_test_placeholder
          export CLERK_PUBLISHABLE_KEY=pk_test_placeholder
          export CLERK_WEBHOOK_SECRET=whsec_placeholder
          
          # Firebase (disabled)
          export FIREBASE_PROJECT_ID=""
          export FIREBASE_CLIENT_EMAIL=""
          export FIREBASE_PRIVATE_KEY=""
          
          # Email/SMS (disabled)
          export SENDGRID_API_KEY=""
          export TWILIO_ACCOUNT_SID=""
          export TWILIO_AUTH_TOKEN=""
          export TWILIO_PHONE_NUMBER=""
          
          # Search (disabled)
          export ELASTICSEARCH_NODE=""
          export ELASTICSEARCH_USERNAME=""
          export ELASTICSEARCH_PASSWORD=""
          
          # MQTT (disabled)
          export MQTT_ENABLED=false
          export MQTT_BROKER_URL=""
          
          # Logging
          export LOG_LEVEL=log
          export THROTTLE_TTL=60
          export THROTTLE_LIMIT=100
          
          # Verify environment
          echo "=== Verifying DATABASE_URL and PG envs ==="
          echo "DATABASE_URL: $DATABASE_URL"
          echo "PGHOST: $PGHOST PGPORT: $PGPORT PGUSER: $PGUSER"
          
          # Test PostgreSQL connectivity over TCP
          echo "=== Testing PostgreSQL connection over TCP ==="
          PGPASSWORD="$PGPASSWORD" psql -h "$PGHOST" -U "$PGUSER" -d "$PGDATABASE" -c "\conninfo" || {
            echo "❌ Cannot connect to PostgreSQL over TCP"
            exit 1
          }
          
          # Verify Node sees DATABASE_URL
          echo "=== Verifying Node environment ==="
          node -e "console.log('DATABASE_URL visible to Node:', process.env.DATABASE_URL ? 'YES' : 'NO')"
          
          # Start application
          nohup npm run start:prod > app.log 2>&1 &
          echo $! > .pidfile
          echo "Application started with PID: $(cat .pidfile)"
          sleep 5
          
          # Check if process is still running
          if ps -p $(cat .pidfile) > /dev/null; then
            echo "✅ Application process is running"
          else
            echo "❌ Application process died immediately"
            echo "=== Last 100 lines of app.log ==="
            tail -100 app.log
            exit 1
          fi

      - name: Wait for application
        run: |
          echo "Waiting for application to be ready..."
          for i in {1..30}; do
            echo "Attempt $i/30..."
            
            # Check if process is still running
            if ! ps -p $(cat .pidfile) > /dev/null; then
              echo "❌ Application process died!"
              echo ""
              echo "=== Last 100 lines of app.log ==="
              tail -100 app.log
              echo ""
              echo "=== Checking for PostgreSQL connection errors ==="
              grep -i "postgres\|database\|connection" app.log | tail -20
              exit 1
            fi
            
            # Try health endpoint
            if curl -f -s http://localhost:3000/health > /dev/null 2>&1; then
              echo "✅ Application is ready!"
              exit 0
            fi
            
            # Try alternative health endpoint
            if curl -f -s http://localhost:3000/api/v1/health > /dev/null 2>&1; then
              echo "✅ Application is ready!"
              exit 0
            fi
            
            sleep 2
          done
          
          echo "❌ Application did not become ready in time"
          echo ""
          echo "=== Full app.log ==="
          cat app.log
          echo ""
          echo "=== Process list ==="
          ps aux | grep node
          echo ""
          echo "=== PostgreSQL connection check (TCP) ==="
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d mash_test -c "SELECT version();" || echo "❌ Cannot connect to PostgreSQL over TCP (verify PGHOST/PGUSER/PGPASSWORD)"
          exit 1

      - name: Check app logs if startup failed
        if: failure()
        run: |
          echo "=== Application Logs ==="
          cat app.log || echo "No app.log found"
          echo "=== Process Status ==="
          ps aux | grep node || echo "No node processes"

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Create k6 test script
        run: |
          mkdir -p k6-tests
          cat > k6-tests/load-test.js << 'EOF'
          import http from 'k6/http';
          import { check, sleep } from 'k6';
          import { Rate, Trend } from 'k6/metrics';

          const errorRate = new Rate('errors');
          const responseTrend = new Trend('response_time');

          export const options = {
            stages: [
              { duration: '30s', target: 50 },   // Ramp up to 50 users
              { duration: '1m', target: 100 },   // Stay at 100 users
              { duration: '30s', target: 0 },    // Ramp down
            ],
            thresholds: {
              http_req_duration: ['p(95)<500', 'p(99)<1000'],
              errors: ['rate<0.1'],
            },
          };

          const BASE_URL = 'http://localhost:3000';

          export default function () {
            // Health check
            let res = http.get(`${BASE_URL}/api/v1/health`);
            check(res, {
              'health check status 200': (r) => r.status === 200,
            }) || errorRate.add(1);
            responseTrend.add(res.timings.duration);

            sleep(1);

            // Products endpoint (adjust to actual endpoint)
            res = http.get(`${BASE_URL}/api/v1/products?page=1&limit=10`);
            check(res, {
              'products status 200 or 401': (r) => r.status === 200 || r.status === 401,
            }) || errorRate.add(1);
            if (res.status === 200) {
              responseTrend.add(res.timings.duration);
            }

            sleep(1);
          }
          EOF

      - name: Run k6 performance tests
        id: k6-test
        run: |
          k6 run --out json=k6-results.json k6-tests/load-test.js || echo "k6_failed=true" >> $GITHUB_OUTPUT

      - name: Parse k6 results
        id: parse-results
        run: |
          # Extract key metrics
          P95=$(cat k6-results.json | jq -r 'select(.type=="Point" and .metric=="http_req_duration" and .data.tags.expected_response=="true") | .data.value' | awk '{sum+=$1; count++} END {print sum/count}' | xargs printf "%.2f")
          P99=$(cat k6-results.json | jq -r 'select(.type=="Point" and .metric=="http_req_duration" and .data.tags.expected_response=="true") | .data.value' | sort -n | tail -n 1 | xargs printf "%.2f")
          ERROR_RATE=$(cat k6-results.json | jq -r 'select(.type=="Point" and .metric=="errors") | .data.value' | awk '{sum+=$1; count++} END {if(count>0) print sum/count; else print 0}')
          
          echo "p95=$P95" >> $GITHUB_OUTPUT
          echo "p99=$P99" >> $GITHUB_OUTPUT
          echo "error_rate=$ERROR_RATE" >> $GITHUB_OUTPUT
          
          # Check regression
          if (( $(echo "$P99 > $PERFORMANCE_THRESHOLD_P99" | bc -l) )); then
            echo "regression=true" >> $GITHUB_OUTPUT
          else
            echo "regression=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate HTML report
        run: |
          cat > k6-report.html << EOF
          <!DOCTYPE html>
          <html>
          <head><title>K6 Performance Test Report</title></head>
          <body>
            <h1>🚀 Performance Test Results</h1>
            <h2>Key Metrics</h2>
            <ul>
              <li><strong>P95 Response Time:</strong> ${{ steps.parse-results.outputs.p95 }}ms</li>
              <li><strong>P99 Response Time:</strong> ${{ steps.parse-results.outputs.p99 }}ms</li>
              <li><strong>Error Rate:</strong> ${{ steps.parse-results.outputs.error_rate }}%</li>
            </ul>
            <h2>Threshold Status</h2>
            <p>P99 Threshold: ${PERFORMANCE_THRESHOLD_P99}ms</p>
            <p>Status: ${{ steps.parse-results.outputs.regression == 'true' && '❌ REGRESSION DETECTED' || '✅ PASSED' }}</p>
          </body>
          </html>
          EOF

      - name: Upload k6 results
        uses: actions/upload-artifact@v4
        with:
          name: k6-results
          path: |
            k6-results.json
            k6-report.html

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const p95 = '${{ steps.parse-results.outputs.p95 }}';
            const p99 = '${{ steps.parse-results.outputs.p99 }}';
            const errorRate = '${{ steps.parse-results.outputs.error_rate }}';
            const regression = '${{ steps.parse-results.outputs.regression }}' === 'true';
            
            const body = `## 🚀 Performance Test Results
            
            ### Key Metrics
            - **P95 Response Time**: ${p95}ms
            - **P99 Response Time**: ${p99}ms ${regression ? '⚠️ **EXCEEDS THRESHOLD**' : '✅'}
            - **Error Rate**: ${errorRate}%
            
            ### Status
            ${regression ? '❌ **Performance Regression Detected**' : '✅ **Performance Acceptable**'}
            
            **Threshold**: P99 < ${process.env.PERFORMANCE_THRESHOLD_P99}ms
            
            [View detailed report](../actions/runs/${context.runId})
            `;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: body
            });

      - name: Fail if regression detected
        if: steps.parse-results.outputs.regression == 'true'
        run: |
          echo "::error::Performance regression detected! P99 response time exceeds threshold."
          exit 1

      - name: Stop application
        if: always()
        run: |
          if [ -f .pidfile ]; then
            kill $(cat .pidfile) || true
          fi
