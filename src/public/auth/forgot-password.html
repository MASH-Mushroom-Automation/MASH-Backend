<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password - MASH Backend</title>
    <link rel="stylesheet" href="/public/assets/css/auth.css" />
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-card">
        <!-- Logo & Title -->
        <div class="auth-logo">
          <h1>🍄 MASH</h1>
        </div>

        <!-- Header -->
        <div class="auth-header">
          <h2>Forgot Password?</h2>
          <p>Enter your email address and we'll send you a reset link</p>
        </div>

        <!-- Error Message -->
        <div id="error-message" class="message message-error"></div>

        <!-- Success Message -->
        <div id="success-message" class="message message-success"></div>

        <!-- Forgot Password Form -->
        <form id="forgot-password-form">
          <!-- Email -->
          <div class="form-group">
            <label for="email" class="form-label required">Email Address</label>
            <input
              type="email"
              id="email"
              class="form-input"
              placeholder="Enter your email"
              required
              autocomplete="email"
            />
          </div>

          <!-- Submit Button -->
          <button type="submit" id="submit-btn" class="btn btn-primary btn-full-width">
            Send Reset Link
          </button>
        </form>

        <!-- Back to Login -->
        <div class="auth-link" style="margin-top: 24px;">
          <a href="/">← Back to login</a>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="/public/assets/js/api-client.js"></script>
    <script src="/public/assets/js/auth.js"></script>
    <script>
      // Forgot password form submission
      document.getElementById('forgot-password-form').addEventListener('submit', async function (e) {
        e.preventDefault();

        const email = document.getElementById('email').value.trim();

        // Validation
        if (!validateEmail(email)) {
          showError('error-message', 'Please enter a valid email address');
          return;
        }

        // Show loading state
        showLoading('submit-btn');

        try {
          // Call backend forgot password API
          const response = await apiClient.post('/auth/forgot-password', {
            email,
          });

          hideLoading('submit-btn');

          // Show success message
          const successMessage = response.message || 
            'Password reset email sent! Please check your inbox and follow the instructions.';
          showSuccess('success-message', successMessage);

          // Hide form
          document.getElementById('forgot-password-form').style.display = 'none';

          // Show additional instructions
          document.querySelector('.auth-header').innerHTML = `
            <h2>Check Your Email</h2>
            <p>We've sent a password reset link to <strong>${email}</strong></p>
            <p style="margin-top: 16px; font-size: 14px; color: #6b7280;">
              The link will expire in 15 minutes. If you don't see the email, check your spam folder.
            </p>
          `;

          // Show back to login button
          setTimeout(() => {
            const backButton = document.createElement('button');
            backButton.type = 'button';
            backButton.className = 'btn btn-primary btn-full-width';
            backButton.textContent = 'Back to Login';
            backButton.onclick = () => window.location.href = '/';
            document.querySelector('.auth-card').appendChild(backButton);
          }, 1000);
        } catch (error) {
          hideLoading('submit-btn');
          const errorMessage = error.data?.message || error.message || 
            'Failed to send reset email. Please try again.';
          showError('error-message', errorMessage);
        }
      });

      // Check if already logged in
      if (isAuthenticated()) {
        redirectToDashboard();
      }
    </script>
  </body>
</html>
