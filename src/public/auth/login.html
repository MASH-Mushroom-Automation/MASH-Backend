<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - MASH Backend</title>
    <link rel="stylesheet" href="/public/assets/css/auth.css" />
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-card">
        <!-- Logo & Title -->
        <div class="auth-logo">
          <h1>🍄 MASH</h1>
          <p style="font-size: 14px; color: #6b7280; margin-top: 4px">
            Mushroom Automation with Smart Hydro-environment
          </p>
        </div>

        <!-- Header -->
        <div class="auth-header">
          <h2>Welcome Back</h2>
          <p>Sign in to your account to continue</p>
        </div>

        <!-- Error Message -->
        <div id="error-message" class="message message-error"></div>

        <!-- Success Message -->
        <div id="success-message" class="message message-success"></div>

        <!-- Login Form -->
        <form id="login-form">
          <!-- Email -->
          <div class="form-group">
            <label for="email" class="form-label required">Email</label>
            <input
              type="email"
              id="email"
              class="form-input"
              placeholder="Enter your email"
              required
              autocomplete="email"
            />
          </div>

          <!-- Password -->
          <div class="form-group">
            <label for="password" class="form-label required">Password</label>
            <div class="input-with-icon">
              <input
                type="password"
                id="password"
                class="form-input"
                placeholder="Enter your password"
                required
                autocomplete="current-password"
              />
              <span class="input-icon" id="toggle-password" title="Show password">
                👁️
              </span>
            </div>
          </div>

          <!-- Remember Me & Forgot Password -->
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
            <div class="checkbox-group">
              <input type="checkbox" id="remember-me" />
              <label for="remember-me">Remember me</label>
            </div>
            <a href="/forgot-password" style="font-size: 14px; color: #3b82f6; text-decoration: none;">
              Forgot password?
            </a>
          </div>

          <!-- Submit Button -->
          <button type="submit" id="login-btn" class="btn btn-primary btn-full-width">
            Sign In
          </button>
        </form>

        <!-- Divider -->
        <div class="divider">
          <span>Or continue with</span>
        </div>

        <!-- OAuth Buttons -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px;">
          <button type="button" class="btn btn-oauth" id="google-oauth">
            <svg width="20" height="20" viewBox="0 0 20 20">
              <path fill="#4285F4" d="M19.6 10.23c0-.82-.1-1.42-.25-2.05H10v3.72h5.5c-.15.96-.74 2.31-2.04 3.22v2.45h3.16c1.89-1.73 2.98-4.3 2.98-7.34z"/>
              <path fill="#34A853" d="M13.46 15.13c-.83.59-1.96 1-3.46 1-2.64 0-4.88-1.74-5.68-4.15H1.07v2.52C2.72 17.75 6.09 20 10 20c2.7 0 4.96-.89 6.62-2.42l-3.16-2.45z"/>
              <path fill="#FBBC05" d="M3.99 10c0-.69.12-1.35.32-1.97V5.51H1.07A9.973 9.973 0 000 10c0 1.61.39 3.14 1.07 4.49l3.24-2.52c-.2-.62-.32-1.28-.32-1.97z"/>
              <path fill="#EA4335" d="M10 3.88c1.88 0 3.13.81 3.85 1.48l2.84-2.76C14.96.99 12.7 0 10 0 6.09 0 2.72 2.25 1.07 5.51l3.24 2.52C5.12 5.62 7.36 3.88 10 3.88z"/>
            </svg>
            Google
          </button>

          <button type="button" class="btn btn-oauth" id="github-oauth">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="#181717">
              <path d="M10 0C4.477 0 0 4.477 0 10c0 4.42 2.865 8.17 6.839 9.49.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.463-1.11-1.463-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.831.092-.646.35-1.086.636-1.336-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0110 4.836c.85.004 1.705.114 2.504.336 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C17.137 18.165 20 14.418 20 10c0-5.523-4.477-10-10-10z"/>
            </svg>
            GitHub
          </button>
        </div>

        <!-- Register Link -->
        <div class="auth-link">
          Don't have an account? <a href="/register">Sign up</a>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="/public/assets/js/api-client.js"></script>
    <script src="/public/assets/js/auth.js"></script>
    <script>
      // Password visibility toggle
      document.getElementById('toggle-password').addEventListener('click', function () {
        const passwordInput = document.getElementById('password');
        const type = passwordInput.type === 'password' ? 'text' : 'password';
        passwordInput.type = type;
        this.textContent = type === 'password' ? '👁️' : '🙈';
      });

      // Login form submission
      document.getElementById('login-form').addEventListener('submit', async function (e) {
        e.preventDefault();

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const rememberMe = document.getElementById('remember-me').checked;

        // Validation
        if (!validateEmail(email)) {
          showError('error-message', 'Please enter a valid email address');
          return;
        }

        if (password.length < 8) {
          showError('error-message', 'Password must be at least 8 characters');
          return;
        }

        // Show loading state
        showLoading('login-btn');

        try {
          // Call backend login API
          const response = await apiClient.post('/auth/login', {
            email,
            password,
          });

          // Save tokens
          saveTokens(response.accessToken, response.refreshToken);

          // Save user data
          if (response.user) {
            saveUser(response.user);
          }

          // Show success message
          showSuccess('success-message', 'Login successful! Redirecting...');

          // Redirect to dashboard after 1 second
          setTimeout(() => {
            redirectToDashboard();
          }, 1000);
        } catch (error) {
          hideLoading('login-btn');
          const errorMessage = error.data?.message || error.message || 'Login failed. Please check your credentials.';
          showError('error-message', errorMessage);
        }
      });

      // Google OAuth
      document.getElementById('google-oauth').addEventListener('click', function () {
        window.location.href = '/api/v1/auth/oauth/google';
      });

      // GitHub OAuth
      document.getElementById('github-oauth').addEventListener('click', function () {
        window.location.href = '/api/v1/auth/oauth/github';
      });

      // Check if already logged in
      if (isAuthenticated()) {
        redirectToDashboard();
      }

      // Check for OAuth callback tokens in URL
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');
      const refreshToken = urlParams.get('refresh');

      if (token && refreshToken) {
        saveTokens(token, refreshToken);
        showSuccess('success-message', 'OAuth login successful! Redirecting...');
        setTimeout(() => {
          redirectToDashboard();
        }, 1000);
      }
    </script>
  </body>
</html>
