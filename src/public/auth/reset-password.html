<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - MASH Backend</title>
    <link rel="stylesheet" href="/public/assets/css/auth.css" />
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-card">
        <!-- Logo & Title -->
        <div class="auth-logo">
          <h1>🍄 MASH</h1>
        </div>

        <!-- Header -->
        <div class="auth-header">
          <h2>Reset Password</h2>
          <p>Choose a strong password for your account</p>
        </div>

        <!-- Error Message -->
        <div id="error-message" class="message message-error"></div>

        <!-- Success Message -->
        <div id="success-message" class="message message-success"></div>

        <!-- Reset Password Form -->
        <form id="reset-password-form">
          <!-- New Password -->
          <div class="form-group">
            <label for="password" class="form-label required">New Password</label>
            <div class="input-with-icon">
              <input
                type="password"
                id="password"
                class="form-input"
                placeholder="Enter new password"
                required
                autocomplete="new-password"
                minlength="8"
              />
              <span class="input-icon" id="toggle-password" title="Show password">
                👁️
              </span>
            </div>

            <!-- Password Strength Meter -->
            <div class="password-strength" id="password-strength">
              <div class="strength-bar">
                <div class="strength-fill" id="strength-fill"></div>
              </div>
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <span class="strength-text" id="strength-text">WEAK</span>
                <span class="strength-feedback" id="strength-feedback"></span>
              </div>
            </div>
          </div>

          <!-- Confirm Password -->
          <div class="form-group">
            <label for="confirmPassword" class="form-label required">Confirm Password</label>
            <div class="input-with-icon">
              <input
                type="password"
                id="confirmPassword"
                class="form-input"
                placeholder="Re-enter new password"
                required
                autocomplete="new-password"
              />
              <span class="input-icon" id="toggle-confirm-password" title="Show password">
                👁️
              </span>
            </div>
          </div>

          <!-- Password Requirements -->
          <div style="background: #f9fafb; padding: 16px; border-radius: 8px; margin-bottom: 24px;">
            <p style="font-size: 14px; font-weight: 600; color: #111827; margin-bottom: 8px;">
              Password Requirements:
            </p>
            <ul style="font-size: 14px; color: #6b7280; margin-left: 20px; line-height: 1.8;">
              <li>At least 8 characters long</li>
              <li>Contains uppercase and lowercase letters</li>
              <li>Contains at least one number</li>
              <li>Contains at least one special character</li>
            </ul>
          </div>

          <!-- Submit Button -->
          <button type="submit" id="reset-btn" class="btn btn-primary btn-full-width">
            Reset Password
          </button>
        </form>

        <!-- Back to Login -->
        <div class="auth-link" style="margin-top: 24px;">
          <a href="/">← Back to login</a>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="/public/assets/js/api-client.js"></script>
    <script src="/public/assets/js/auth.js"></script>
    <script>
      // Get reset token from URL parameter
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');

      if (!token) {
        showError('error-message', 'Invalid or missing reset token. Redirecting...');
        setTimeout(() => {
          window.location.href = '/forgot-password';
        }, 3000);
      }

      // Password visibility toggle
      document.getElementById('toggle-password').addEventListener('click', function () {
        const passwordInput = document.getElementById('password');
        const type = passwordInput.type === 'password' ? 'text' : 'password';
        passwordInput.type = type;
        this.textContent = type === 'password' ? '👁️' : '🙈';
      });

      document.getElementById('toggle-confirm-password').addEventListener('click', function () {
        const passwordInput = document.getElementById('confirmPassword');
        const type = passwordInput.type === 'password' ? 'text' : 'password';
        passwordInput.type = type;
        this.textContent = type === 'password' ? '👁️' : '🙈';
      });

      // Password strength meter
      document.getElementById('password').addEventListener('input', function () {
        updatePasswordStrength(
          this.value,
          'password-strength',
          'strength-feedback'
        );
      });

      // Reset password form submission
      document.getElementById('reset-password-form').addEventListener('submit', async function (e) {
        e.preventDefault();

        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        // Validation
        if (password.length < 8) {
          showError('error-message', 'Password must be at least 8 characters');
          return;
        }

        if (password !== confirmPassword) {
          showError('error-message', 'Passwords do not match');
          return;
        }

        // Check password strength
        const strength = calculatePasswordStrength(password);
        if (strength.strength < 40) {
          showError('error-message', 'Please choose a stronger password');
          return;
        }

        // Show loading state
        showLoading('reset-btn');

        try {
          // Call backend reset password API
          const response = await apiClient.post('/auth/reset-password', {
            token,
            newPassword: password,
          });

          hideLoading('reset-btn');

          // Show success message
          const successMessage = response.message || 
            '✓ Password reset successfully! You can now login with your new password.';
          showSuccess('success-message', successMessage);

          // Hide form
          document.getElementById('reset-password-form').style.display = 'none';

          // Update header
          document.querySelector('.auth-header').innerHTML = `
            <h2>Password Reset Complete</h2>
            <p>Your password has been successfully reset</p>
          `;

          // Redirect to login after 3 seconds
          setTimeout(() => {
            window.location.href = '/';
          }, 3000);
        } catch (error) {
          hideLoading('reset-btn');
          const errorMessage = error.data?.message || error.message || 
            'Failed to reset password. The token may have expired.';
          showError('error-message', errorMessage);

          // If token expired, show link to request new one
          if (error.status === 400 || error.status === 410) {
            setTimeout(() => {
              const linkDiv = document.createElement('div');
              linkDiv.className = 'auth-link';
              linkDiv.innerHTML = '<a href="/forgot-password">Request a new reset link</a>';
              document.querySelector('.auth-card').appendChild(linkDiv);
            }, 1000);
          }
        }
      });

      // Check if already logged in
      if (isAuthenticated()) {
        redirectToDashboard();
      }
    </script>
  </body>
</html>
